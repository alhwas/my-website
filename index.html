// ======================== دوال مساعدة =========================
function gi(url) {
  try { return "p_" + new URL(url).pathname.replace(/[^a-z0-9/]/gi,"_").replace(/\/+/g,"_"); }
  catch { return "p_" + Math.random().toString(36).slice(2); }
}
function detectCategory(title, content, blogLabels) {
  if (blogLabels && blogLabels.length) {
    for (const [k, cat] of Object.entries(CATS)) {
      if (k==="all"||!cat.labels||!cat.labels.length) continue;
      if (blogLabels.some(lbl => cat.labels.some(cl2 => lbl.trim()===cl2.trim()))) return k;
    }
    for (const [k, cat] of Object.entries(CATS)) {
      if (k==="all"||!cat.labels||!cat.labels.length) continue;
      if (blogLabels.some(lbl => cat.labels.some(cl2 => cl2.includes(lbl.trim())||lbl.trim().includes(cl2.trim())))) return k;
    }
    for (const [k, cat] of Object.entries(CATS)) {
      if (k==="all"||!cat.kw||!cat.kw.length) continue;
      if (blogLabels.some(lbl => cat.kw.some(w => lbl.toLowerCase().includes(w)))) return k;
    }
  }
  const tl=title.toLowerCase(), cl=content.toLowerCase();
  let best=null, mx=0;
  for (const [k, cat] of Object.entries(CATS)) {
    if (k==="all") continue;
    let m=0;
    cat.kw.forEach(w=>{ if(tl.includes(w)) m+=3; else if(cl.includes(w)) m+=1; });
    if (m>mx) { mx=m; best=k; }
  }
  return best||"tools";
}
function getPlaceholderIcon(title) {
  const cs=["2196F3","4CAF50","FF9800","9C27B0","F44336","607D8B"];
  let txt="A";
  try { txt=encodeURIComponent((title||"").slice(0,2))||"A"; } catch {}
  return `https://placehold.co/80/${cs[(title||"").length%6]}/fff?text=${txt}`;
}
function formatDateLong(d) {
  try { return new Date(d).toLocaleDateString("ar-SA",{year:"numeric",month:"long",day:"numeric"}); }
  catch { return d; }
}
function formatDateShort(d) {
  try { return new Date(d).toLocaleDateString("ar-SA",{year:"numeric",month:"short",day:"numeric"}); }
  catch { return d; }
}
function stars(avg) {
  const f=Math.floor(avg);
  return Array.from({length:5},(_,i)=>i<f?"★":"☆").join("");
}
function isNew(dateStr) {
  try { return (Date.now()-new Date(dateStr).getTime()) < 7*24*60*60*1000; }
  catch { return false; }
}
function formatNumber(n) {
  if (!n||n===0) return "0";
  if (n>=1000000) return (n/1000000).toFixed(1)+"M";
  if (n>=1000) return (n/1000).toFixed(1)+"K";
  return String(n);
}
function formatSize(bytes) {
  if (!bytes||bytes<=0) return null;
  if (bytes<1024*1024) return `${(bytes/1024).toFixed(0)} KB`;
  return `${(bytes/(1024*1024)).toFixed(1)} MB`;
}
function showToast(msg) {
  const el=document.getElementById("toast");
  if (!el) return;
  el.textContent=msg;
  el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),2500);
}
function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escapeAttr(str) {
  return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
}
function timeAgo(dateStr) {
  try {
    const diff=(Date.now()-new Date(dateStr).getTime())/1000;
    if (diff<60) return "الآن";
    if (diff<3600) return `${Math.floor(diff/60)} دقيقة`;
    if (diff<86400) return `${Math.floor(diff/3600)} ساعة`;
    if (diff<2592000) return `${Math.floor(diff/86400)} يوم`;
    return formatDateShort(dateStr);
  } catch { return ""; }
}

// ======================== استخراج روابط التحميل =========================
function extractDownloadLink(content) {
  try {
    let cc=content.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi,'').replace(/<style\b[^<]*(?:(?!<\/style>)<[^<]*)*<\/style>/gi,'');
    const ar=/<a[^>]*href=["'](https?:\/\/[^"']+)["'][^>]*>(.*?)<\/a>/gi;
    let match,all=[];
    while((match=ar.exec(cc))!==null) if(match[1]) all.push(match[1]);
    const ur=/https?:\/\/[^\s<>"'{}|\\^~\[\]`]+/gi;
    while((match=ur.exec(cc))!==null) if(!all.includes(match[0])) all.push(match[0]);
    const clean=all.map(u=>u.replace(/"/g,'').replace(/&/g,'&').replace(/[<>"']/g,'').split(/[">']/)[0]);
    const direct=clean.filter(u=>DIRECT_DOWNLOAD_SITES.some(s=>u.toLowerCase().includes(s)));
    if(direct.length===1) return direct[0];
    const catbox=clean.find(u=>u.toLowerCase().includes('catbox.moe')||u.toLowerCase().includes('catbox'));
    if(catbox) return catbox;
    if(direct.length>1) return direct[0];
    return "not available";
  } catch { return "not available"; }
}

// ======================== استخراج الصور (محدّث) =========================
function extractScreenshots(content) {
  try {
    const doc = new DOMParser().parseFromString(content, "text/html");
    // أولاً: صور بـ data-role="screenshot" (مولّد V8+)
    const roleImgs = doc.querySelectorAll('img[data-role="screenshot"]');
    if (roleImgs.length > 0) {
      return Array.from(roleImgs).slice(0,8).map(img=>img.getAttribute('src')).filter(Boolean);
    }
    // ثانياً: صور داخل .gallery-v2
    const galleryImgs = doc.querySelectorAll('.gallery-v2 img');
    if (galleryImgs.length > 0) {
      return Array.from(galleryImgs).slice(0,8).map(img=>img.getAttribute('src')).filter(Boolean);
    }
    // احتياطي: كل الصور ما عدا الأيقونة الرئيسية وأيقونات الميزات
    const imgs = [];
    const allImgs = doc.querySelectorAll('img');
    let skippedFirst = false;
    for (const img of allImgs) {
      const src = img.getAttribute('src') || '';
      if (!src || src.includes('placehold') || src.includes('1x1') || src.length <= 10) continue;
      if (img.closest('.feature-icons-v2')) continue; // تخطي أيقونات الميزات
      if (img.getAttribute('data-role') === 'icon') continue; // تخطي الأيقونة الرئيسية
      if (!skippedFirst) { skippedFirst = true; continue; } // تخطي أول صورة (الأيقونة الرئيسية)
      imgs.push(src);
      if (imgs.length >= 8) break;
    }
    return imgs;
  } catch { return []; }
}

// ======================== استخراج الأيقونة الرئيسية =========================
function extractMainIcon(content, title) {
  try {
    const doc = new DOMParser().parseFromString(content, "text/html");
    // data-role="icon" أولاً
    const roleIcon = doc.querySelector('img[data-role="icon"]');
    if (roleIcon) return roleIcon.getAttribute('src');
    // أول صورة خارج .gallery-v2 و .feature-icons-v2
    const allImgs = doc.querySelectorAll('img');
    for (const img of allImgs) {
      if (img.closest('.gallery-v2') || img.closest('.feature-icons-v2')) continue;
      const src = img.getAttribute('src') || '';
      if (src && !src.includes('placehold') && !src.includes('1x1') && src.length > 10) return src;
    }
    // احتياطي: أول صورة
    for (const img of allImgs) {
      const src = img.getAttribute('src') || '';
      if (src && !src.includes('placehold') && !src.includes('1x1') && src.length > 10) return src;
    }
  } catch {}
  return getPlaceholderIcon(title);
}

// ======================== استخراج الوصف =========================
function extractDescription(doc) {
  try {
    // أولاً: قسم "لمحة عن التطبيق" بـ data-role="overview"
    const overviewEl = doc.querySelector('[data-role="overview"] .editable-content-v2,[data-role="overview"] div[dir="rtl"]');
    if (overviewEl) {
      const txt = (overviewEl.textContent || '').replace(/\s+/g,' ').trim();
      if (txt.length > 20) return txt;
    }
    // ثانياً: أي .editable-content-v2
    const editableEl = doc.querySelector('.editable-content-v2');
    if (editableEl) {
      const txt = (editableEl.textContent || '').replace(/\s+/g,' ').trim();
      if (txt.length > 20) return txt;
    }
    return null;
  } catch { return null; }
}

// ======================== معالجة المنشورات =========================
function processPosts(posts, existing=[]) {
  const out=[];
  let id=existing.length+1;
  for (const p of posts) {
    try {
      const title=p.title.$t||"بدون عنوان";
      let raw=p.content.$t||"";
      const pub=p.published.$t||new Date().toISOString();
      if(existing.some(a=>a.title===title)) continue;
      const blogLabels=(p.category||[]).map(c=>c.term||"");
      const dl=extractDownloadLink(raw);
      const screenshots=extractScreenshots(raw);
      const thumb=extractMainIcon(raw,title);
      // إزالة <style> و <script> قبل معالجة النص
      const doc=new DOMParser().parseFromString(raw,"text/html");
      doc.querySelectorAll('style,script,code,pre,noscript').forEach(el=>el.remove());
      // استخراج الإصدار من عنصر detail-item-v2 أولاً
      let version="1.0.0";
      const versionEl=doc.querySelector('.detail-text-v2 b');
      if(versionEl&&versionEl.textContent.includes('الإصدار')) {
        const vTxt=versionEl.parentElement?.textContent||"";
        const vm=vTxt.match(/الإصدار[\s:]*([^\s]+)/i);
        if(vm) version=vm[1];
      } else {
        const rawText=raw.replace(/<[^>]+>/g,' ');
        const vm=rawText.match(/(\d+\.\d+\.\d+)/)||rawText.match(/(\d+\.\d+)/)||rawText.match(/الإصدار[\s:]*([\d.]+)/i);
        if(vm) version=vm[1];
      }
      // الوصف: استخراج من قسم "لمحة" أو النص العام
      let txt = extractDescription(doc) || "";
      if (!txt) {
        doc.querySelectorAll('.program-details-v2,.feature-icons-v2').forEach(el=>el.remove());
        txt=(doc.body.textContent||"").replace(/\s+/g," ").trim();
        let prev;
        do { prev=txt; txt=txt.replace(/\{[^{}]*\}/g," "); } while(txt!==prev);
        txt=txt.replace(/[\w-]+\s*:\s*[^;،.\n!؟]{1,100};/g," ")
               .replace(/function\s+\w+\s*\([^)]*\)\s*/g," ")
               .replace(/[\w.]+\s*\([^)]{0,200}\)\s*[=;]?\s*/g," ")
               .replace(/[.#][\w-]+\s*/g," ")
               .replace(/\b\d+(%|px|em|rem|vh|vw|pt)\b/g," ")
               .replace(/\b(auto|flex|none|block|fixed|absolute|relative|center|pointer|solid|hidden|scroll)\b/g," ")
               .replace(/[{}();=]/g," ").replace(/\s{2,}/g," ").trim();
      }
      const editorPick = !!doc.querySelector('[data-editor-pick="true"]');
      // تنظيف HTML المنشور من <style>/<script> للعرض الآمن
      const cleanDoc=new DOMParser().parseFromString(raw,"text/html");
      cleanDoc.querySelectorAll('script,noscript').forEach(el=>el.remove());
      // إزالة onclick من الصور واستبدالها بـ data-lightbox
      cleanDoc.querySelectorAll('img').forEach(img=>{
        img.removeAttribute('onclick');
        img.setAttribute('data-lightbox','1');
        img.style.maxWidth='100%';
        img.style.height='auto';
      });
      const postHtml=cleanDoc.body.innerHTML||"";
      const url=p.link.find(l=>l.rel==="alternate")?.href||BLOGGER_URL;
      out.push({ id:id++, title, desc:txt.length>150?txt.slice(0,150)+"...":txt, fullDesc:txt||"—", ver:version, date:new Date(pub).toISOString().split("T")[0], cat:detectCategory(title,txt,blogLabels), dl, thumb, screenshots, url, postHtml, editorPick });
    } catch(e) {}
  }
  return out;
}

// ======================== تطبيع بيانات السحابة =========================
function normalizeCloud(data) {
  if (!data||typeof data!=='object') return {r:{},rev:{}};
  if (data.r) return {r:data.r||{},rev:data.rev||{}};
  return {r:data,rev:{}};  // صيغة قديمة
}

// ======================== السحابة الموحّدة (bin واحد + ضغط) =========================

// هيكل السحابة: { r:{id:{tot,cnt,vw,dl}}, rev:{id:[...]} }

async function fetchCloudData() {
  try {
    const ctrl = new AbortController();
    const tid = setTimeout(() => ctrl.abort(), 6000);
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
      headers: {"X-Master-Key": BIN_KEY},
      signal: ctrl.signal
    });
    clearTimeout(tid);
    if (!res.ok) throw new Error("fetch failed");
    const rec = (await res.json()).record;
    // دعم البيانات المضغوطة والعادية
    if (rec && rec._lz) {
      try {
        const decompressed = LZ.decompress(rec._lz);
        return JSON.parse(decompressed);
      } catch {}
    }
    // بيانات غير مضغوطة (قديمة)
    const r = rec.r || {};
    const rev = rec.rev || {};
    const dl = rec.dl || {};
    // دمج dl القديمة في r
    Object.keys(dl).forEach(id => {
      if (!r[id]) r[id] = {tot:0,cnt:0,vw:0,dl:0};
      r[id].dl = (r[id].dl || 0) + (dl[id] || 0);
    });
    return {r, rev, ep: rec.ep || [], ads: rec.ads || [], bs: rec.bs || {}};
  } catch { return {r: loadRatingsFromLocal(), rev: loadLocalReviews(), ep: loadEditorPicks(), ads: state.bannerAds||[], bs: state.bannerSettings||{}}; }
}

async function pushCloud(data) {
  return new Promise((resolve) => {
    try {
      const compressed = LZ.compress(JSON.stringify(data));
      const body = JSON.stringify({_lz: compressed});
      const xhr = new XMLHttpRequest();
      xhr.open("PUT", `https://api.jsonbin.io/v3/b/${BIN_ID}`, true);
      xhr.setRequestHeader("X-Master-Key", BIN_KEY);
      xhr.setRequestHeader("Content-Type", "application/json");
      xhr.timeout = 10000;
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          resolve(true);
        } else {
          console.warn("pushCloud failed:", xhr.status, xhr.statusText);
          showToast(`☁️ خطأ ${xhr.status} — تحقق من المفتاح`);
          resolve(false);
        }
      };
      xhr.onerror = () => {
        console.warn("pushCloud network error");
        showToast("☁️ خطأ شبكة — تحقق من الاتصال");
        resolve(false);
      };
      xhr.ontimeout = () => {
        console.warn("pushCloud timeout");
        showToast("☁️ انتهت المهلة — حاول مجدداً");
        resolve(false);
      };
      xhr.send(body);
    } catch(e) {
      console.warn("pushCloud exception:", e.message);
      showToast(`☁️ استثناء: ${e.message}`);
      resolve(false);
    }
  });
}

// إرسال التحديثات بعد تجميعها
let pendingSyncTimer = null;
const pendingUpdates = {r:{}, rev:{}};

function flushPendingUpdates() {
  if (pendingSyncTimer) clearTimeout(pendingSyncTimer);
  pendingSyncTimer = setTimeout(async () => {
    const snap = JSON.parse(JSON.stringify(pendingUpdates));
    pendingUpdates.r = {}; pendingUpdates.rev = {};
    try {
      // جلب آخر حالة من السحابة
      const cloud = await fetchCloudData();
      const r = cloud.r || {};
      const rev = cloud.rev || {};
      // تطبيق التحديثات المعلّقة
      Object.entries(snap.r).forEach(([id, delta]) => {
        if (!r[id]) r[id] = {tot:0,cnt:0,vw:0,dl:0};
        r[id].tot = Math.max(0, (r[id].tot||0) + (delta.tot||0));
        r[id].cnt = Math.max(0, (r[id].cnt||0) + (delta.cnt||0));
        r[id].vw  = Math.max(0, (r[id].vw||0)  + (delta.vw||0));
        r[id].dl  = Math.max(0, (r[id].dl||0)  + (delta.dl||0));
      });
      Object.entries(snap.rev).forEach(([id, newReviews]) => {
        if (!rev[id]) rev[id] = [];
        const existing = new Set(rev[id].map(x => x.d + x.n));
        newReviews.filter(x => !existing.has(x.d + x.n)).forEach(x => rev[id].unshift(x));
        rev[id] = rev[id].slice(0, 15);
      });
      await pushCloud({r, rev, ep: state.editorPicks, ads: state.bannerAds||[], bs: state.bannerSettings||{}});
      // تحديث محلي صامت
      saveRatingsToLocal(r);
      state.ratings = {...r};
      Object.entries(rev).forEach(([id, arr]) => { state.reviews[id] = arr; });
      saveLocalReviews(state.reviews);
    } catch(e) {
      // أعد وضع التحديثات في قائمة الانتظار
      Object.entries(snap.r).forEach(([id, d]) => {
        if (!pendingUpdates.r[id]) pendingUpdates.r[id] = {tot:0,cnt:0,vw:0,dl:0};
        pendingUpdates.r[id].tot += d.tot||0; pendingUpdates.r[id].cnt += d.cnt||0;
        pendingUpdates.r[id].vw  += d.vw||0;  pendingUpdates.r[id].dl  += d.dl||0;
      });
      Object.entries(snap.rev).forEach(([id, arr]) => {
        if (!pendingUpdates.rev[id]) pendingUpdates.rev[id] = [];
        pendingUpdates.rev[id].push(...arr);
      });
    }
  }, 1500);
}

function queueRatingUpdate(appId, deltaTot, deltaCnt, deltaVw, deltaDl=0) {
  if (!pendingUpdates.r[appId]) pendingUpdates.r[appId] = {tot:0,cnt:0,vw:0,dl:0};
  pendingUpdates.r[appId].tot += deltaTot;
  pendingUpdates.r[appId].cnt += deltaCnt;
  pendingUpdates.r[appId].vw  += deltaVw;
  pendingUpdates.r[appId].dl  += deltaDl;
  flushPendingUpdates();
}

function queueReviewSync(appId, review) {
  if (!pendingUpdates.rev[appId]) pendingUpdates.rev[appId] = [];
  pendingUpdates.rev[appId].push(review);
  flushPendingUpdates();
}

let currentAbort=null, progressInterval=null, progressStart=0;

function showCircularProgress(percent,elapsed) {
  let c=document.getElementById("circular-container");
  if(!c) {
    c=document.createElement("div");
    c.id="circular-container";
    c.className="circular-progress";
    c.innerHTML=`<svg width="110" height="110" viewBox="0 0 100 100" class="progress-ring">
      <circle cx="50" cy="50" r="48" fill="transparent" stroke-width="8" class="progress-ring-circle-bg"></circle>
      <circle cx="50" cy="50" r="48" fill="transparent" stroke-width="8" stroke-linecap="round" class="progress-ring-circle" stroke-dasharray="301.59" stroke-dashoffset="0"></circle>
    </svg>
    <div class="progress-text">0%</div>
    <div class="progress-label">جاري تحميل الملف</div>
    <div class="progress-time">0 ثانية</div>`;
    document.body.appendChild(c);
  }
  const circum=2*Math.PI*48;
  const offset=circum-(percent/100)*circum;
  const circle=c.querySelector(".progress-ring-circle");
  if(circle) circle.style.strokeDashoffset=offset;
  const textDiv=c.querySelector(".progress-text");
  if(textDiv) textDiv.textContent=Math.floor(percent)+"%";
  const timeDiv=c.querySelector(".progress-time");
  if(timeDiv) timeDiv.textContent=(elapsed/1000).toFixed(1)+" ثانية";
}
function hideCircularProgress() {
  const c=document.getElementById("circular-container");
  if(c) c.remove();
}

async function downloadApk(url, appId=null) {
  if(!url||url==="not available") { showToast("⚠️ رابط التحميل غير متوفر"); return; }
  let filename=url.split('/').pop().split('?')[0];
  if(!filename.toLowerCase().endsWith('.apk')) filename=filename.replace(/\.[^/.]+$/,'')+'.apk';
  if(!filename||filename==='.apk') filename='app.apk';
  if(currentAbort) currentAbort.abort();
  currentAbort=new AbortController();
  progressStart=Date.now();
  if(progressInterval) clearInterval(progressInterval);
  progressInterval=setInterval(()=>{ const e=Date.now()-progressStart; showCircularProgress(5+Math.min(85,(e/8000)*100),e); },50);
  try {
    const response=await fetch(url,{signal:currentAbort.signal});
    if(!response.ok) throw new Error("فشل التحميل");
    const cl=response.headers.get("content-length");
    const reader=response.body.getReader();
    const chunks=[];
    let received=0;
    while(true) {
      const {done,value}=await reader.read();
      if(done) break;
      chunks.push(value);
      received+=value.length;
      const elapsed=Date.now()-progressStart;
      showCircularProgress(cl?Math.min(95,(received/parseInt(cl))*100):Math.min(90,(elapsed/8000)*100),elapsed);
    }
    const blob=new Blob(chunks,{type:"application/vnd.android.package-archive"});
    const blobUrl=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=blobUrl; a.download=filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(blobUrl),10000);
    // تسجيل التحميل - استخدام gi(app.url) لضمان تطابق المفتاح مع بقية التطبيق
    if(appId) {
      const app=state.apps.find(a=>a.id===appId);
      const id=app?gi(app.url):gi(url);
      updateRatingLocally(id,0,0,0,1,true);
      // سجل التحميل
      const hist=loadDownloadHistory();
      if(app) {
        const entry={id:appId,title:app.title,thumb:app.thumb,dl:app.dl,date:new Date().toISOString()};
        saveDownloadHistory([entry,...hist.filter(h=>h.id!==appId)]);
      }
    }
    showToast("✅ تم التحميل بنجاح!");
  } catch(err) {
    if(err.name!=="AbortError") {
      // حتى عند الفتح في نافذة خارجية يُحسب تحميلاً
      if(appId) {
        const app=state.apps.find(a=>a.id===appId);
        const id=app?gi(app.url):gi(url);
        updateRatingLocally(id,0,0,0,1,true);
        const hist=loadDownloadHistory();
        if(app) {
          const entry={id:appId,title:app.title,thumb:app.thumb,dl:app.dl,date:new Date().toISOString()};
          saveDownloadHistory([entry,...hist.filter(h=>h.id!==appId)]);
        }
      }
      window.open(url,"_blank");
      showToast("⚠️ تم فتح رابط التحميل في نافذة جديدة");
    }
  } finally {
    clearInterval(progressInterval); hideCircularProgress(); currentAbort=null;
  }
}

function updateRatingLocally(appId,deltaTot,deltaCnt,deltaVw,deltaDl=0,skipRender=false) {
  const old=state.ratings[appId]||{tot:0,cnt:0,vw:0,dl:0};
  state.ratings={...state.ratings,[appId]:{
    tot:Math.max(0,old.tot+deltaTot),
    cnt:Math.max(0,old.cnt+deltaCnt),
    vw:Math.max(0,old.vw+deltaVw),
    dl:Math.max(0,(old.dl||0)+deltaDl)
  }};
  saveRatingsToLocal(state.ratings);
  if(!skipRender) render();
  queueRatingUpdate(appId,deltaTot,deltaCnt,deltaVw,deltaDl);
}

function checkWishlistUpdates() {
  if (!state.wishlist.length || !state.apps.length) return;
  const meta = loadWishlistMeta();
  const updates = [];
  state.wishlist.forEach(id => {
    const app = state.apps.find(a => a.id === id);
    if (!app || !meta[id]) return;
    const saved = meta[id];
    const dateChanged = app.date && saved.date && app.date !== saved.date && new Date(app.date) > new Date(saved.date);
    const verChanged  = app.ver  && saved.ver  && app.ver  !== saved.ver;
    if (dateChanged || verChanged) {
      updates.push({app, oldDate: saved.date, oldVer: saved.ver, newDate: app.date, newVer: app.ver});
    }
  });
  if (updates.length > 0 && !LS.get("apk_wl_notif_" + updates.map(u=>u.app.id+u.newDate).join("_"), false)) {
    state.wishlistUpdates = updates;
    state.wishlistUpdateOpen = true;
    LS.set("apk_wl_notif_" + updates.map(u=>u.app.id+u.newDate).join("_"), true);
    render();
  }
}
function dismissWishlistUpdate() {
  // تحديث الميتا بالإصدارات الجديدة
  const meta = loadWishlistMeta();
  state.wishlistUpdates.forEach(u => {
    meta[u.app.id] = {date: u.newDate, ver: u.newVer};
  });
  saveWishlistMeta(meta);
  state.wishlistUpdateOpen = false;
  state.wishlistUpdates = [];
  render();
}

function copyToClipboard(text) {

  else {

}

function getFilteredApps() {
  let f=[...state.apps].filter(a=>!state.hiddenApps.includes(a.id));
  if(state.cat!=="all") f=f.filter(a=>a.cat===state.cat);
  if(state.q.trim()) { const lq=state.q.toLowerCase(); f=f.filter(a=>a.title.toLowerCase().includes(lq)||a.desc.toLowerCase().includes(lq)); }
  if(state.sortBy==="rating") f.sort((a,b)=>parseFloat(getRatingForUrl(b.url).avg)-parseFloat(getRatingForUrl(a.url).avg));
  else if(state.sortBy==="views") f.sort((a,b)=>getRatingForUrl(b.url).vw-getRatingForUrl(a.url).vw);
  else if(state.sortBy==="downloads") f.sort((a,b)=>getRatingForUrl(b.url).dl-getRatingForUrl(a.url).dl);
  else f.sort((a,b)=>new Date(b.date)-new Date(a.date));
  return f;
}
function getTopRated() {
  const rated=[...state.apps].filter(a=>getRatingForUrl(a.url).cnt>=1).sort((a,b)=>parseFloat(getRatingForUrl(b.url).avg)-parseFloat(getRatingForUrl(a.url).avg)).slice(0,6);
  if(rated.length>=6) return rated;
  const ratedIds=new Set(rated.map(a=>a.id));
  const extra=[...state.apps].filter(a=>!ratedIds.has(a.id)).sort((a,b)=>getRatingForUrl(b.url).dl-getRatingForUrl(a.url).dl).slice(0,6-rated.length);
  return [...rated,...extra];
}
function getRecentApps() { return [...state.apps].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,12); }
function getMostDownloaded() { return [...state.apps].sort((a,b)=>getRatingForUrl(b.url).dl-getRatingForUrl(a.url).dl).filter(a=>getRatingForUrl(a.url).dl>0).slice(0,8); }

function getSearchSuggestions(q) {

  const lq=q.toLowerCase();
  return state.apps.filter(a=>a.title.toLowerCase().includes(lq)).slice(0,6);

// ======================== جلب التطبيقات =========================
async function fetchApps() {
  // ── عرض الكاش فوراً بدون loading ──
  const cache = localStorage.getItem("apk_c");
  if (cache) {
    try {
      const cd = JSON.parse(cache);
      state.apps = cd.apps;
      state.loading = false;
      updateNewAppsCount();
      render();
      // تحديث السحابة في الخلفية بصمت
      fetchCloudData().then(mergeCloudDataSilent).catch(()=>{});
      // تحديث بيانات بلوجر في الخلفية إن انتهى الـ TTL
      if (Date.now() - cd.ts >= CACHE_TTL) {
        _fetchBloggerInBackground();
      }
      return;
    } catch {}
  }
  // ── أول تشغيل: loading حقيقي ──
  state.loading = true; state.error = ""; render();
  _fetchBloggerInBackground();
}

function _fetchBloggerInBackground() {
  const script = document.createElement("script");
  script.setAttribute("data-bd","1");
  script.src = `${BLOGGER_URL}/feeds/posts/default?alt=json-in-script&max-results=${APPS_PER_FETCH}&start-index=1&callback=onBloggerData`;
  window.onBloggerData = (data) => {
    const posts = data.feed.entry || [];
    const apps = processPosts(posts, []);
    // تحديث صامت إن كان هناك كاش سابق
    const hadCache = state.apps.length > 0;
    state.apps = apps;
    state.loading = false;
    try { localStorage.setItem("apk_c", JSON.stringify({apps, ts:Date.now()})); } catch {}
    updateNewAppsCount();
    if (!hadCache) render();
    // فحص تحديثات الرغبات بعد تحميل التطبيقات
    setTimeout(checkWishlistUpdates, 1200);
    // جلب السحابة في الخلفية
    fetchCloudData().then(hadCache ? mergeCloudDataSilent : mergeCloudData).catch(()=>{
      if (!hadCache) render();
    });
    document.head.removeChild(script);
    delete window.onBloggerData;
    if (state._pendingDeepLinkId) { openDetail(state._pendingDeepLinkId); state._pendingDeepLinkId = null; }
  };
  script.onerror = () => {
    state.loading = false;
    if (state.apps.length === 0) { state.error = "فشل التحميل - تحقق من الاتصال"; render(); }
    document.head.removeChild(script); delete window.onBloggerData;
  };
  document.head.appendChild(script);
}

// دمج مع render كامل (أول تشغيل)
function mergeCloudData(cloud) {
  const merged = {...state.ratings, ...cloud.r};
  state.ratings = merged;
  saveRatingsToLocal(merged);
  const localRev = loadLocalReviews();
  const mergedRev = {...localRev};
  Object.entries(cloud.rev||{}).forEach(([id,arr]) => {
    if (!mergedRev[id]) mergedRev[id] = arr;
    else {
      const existing = new Set(mergedRev[id].map(r=>r.d+r.n));
      const newOnes = arr.filter(r=>!existing.has(r.d+r.n));
      mergedRev[id] = [...mergedRev[id], ...newOnes].slice(0,15);
    }
  });
  state.reviews = mergedRev;
  saveLocalReviews(mergedRev);
  // اختيارات المحرر
  if (cloud.ep && cloud.ep.length) {
    state.editorPicks = cloud.ep;
    saveEditorPicks(cloud.ep);
  }
  // الإعلانات وإعدادات البانر
  if (cloud.ads && cloud.ads.length) { state.bannerAds = cloud.ads; saveBannerAds(cloud.ads); }
  if (cloud.bs && Object.keys(cloud.bs).length) { state.bannerSettings = Object.assign({speed:14,gap:12,maxWidth:160}, cloud.bs); saveBannerSettings(state.bannerSettings); }
  render();
}

// دمج صامت — يحدّث الأرقام بدون وميض أو إعادة رسم كامل
function mergeCloudDataSilent(cloud) {
  let changed = false;
  const r = cloud.r || {};
  Object.entries(r).forEach(([id, vals]) => {
    const cur = state.ratings[id] || {tot:0,cnt:0,vw:0,dl:0};
    const nw = {
      tot: Math.max(cur.tot||0, vals.tot||0),
      cnt: Math.max(cur.cnt||0, vals.cnt||0),
      vw:  Math.max(cur.vw||0,  vals.vw||0),
      dl:  Math.max(cur.dl||0,  vals.dl||0)
    };
    if (JSON.stringify(cur) !== JSON.stringify(nw)) { state.ratings[id] = nw; changed = true; }
  });
  const rev = cloud.rev || {};
  Object.entries(rev).forEach(([id,arr]) => {
    const localArr = state.reviews[id] || [];
    const existing = new Set(localArr.map(x=>x.d+x.n));
    const newOnes = arr.filter(x=>!existing.has(x.d+x.n));
    if (newOnes.length) { state.reviews[id] = [...localArr, ...newOnes].slice(0,15); changed = true; }
  });
  // اختيارات المحرر
  if (cloud.ep && cloud.ep.length) {
    state.editorPicks = cloud.ep;
    saveEditorPicks(cloud.ep);
    changed = true;
  }
  // الإعلانات وإعدادات البانر
  if (cloud.ads && cloud.ads.length) { state.bannerAds = cloud.ads; saveBannerAds(cloud.ads); changed = true; }
  if (cloud.bs && Object.keys(cloud.bs||{}).length) { state.bannerSettings = Object.assign({speed:14,gap:12,maxWidth:160}, cloud.bs); saveBannerSettings(state.bannerSettings); changed = true; }
  if (changed) {
    saveRatingsToLocal(state.ratings);
    saveLocalReviews(state.reviews);
    render();
  }
}

// ======================== العرض الرئيسي =========================
let _renderPending=false;
let _adminScrollRestore=null;
function render() {
  if(_renderPending) return;
  _renderPending=true;
  requestAnimationFrame(()=>{ _renderPending=false; _doRender(); });
}

function _doRender() {
  try {
    const appDiv=document.getElementById("app");
    if(!appDiv) return;
    const T=getThemeColors();
    const isDark=state.themeMode==="auto"?state.sysDark:state.themeMode==="dark";
    const metaTC=document.getElementById("themeColorMeta");
    if(metaTC) metaTC.content=isDark?"#0f1117":"#ffffff";
    const filtered=getFilteredApps();
    const renderedApps=filtered.slice(0,state.rCnt+PER_PAGE);
    const topRated=getTopRated();
    const recent=getRecentApps();
    const mostDl=getMostDownloaded();
    const newWeek=getNewThisWeek();
    refreshEditorPicks();

    appDiv.innerHTML=`
    <div style="background:${T.bg};color:${T.tx};min-height:100vh;font-size:15px;direction:rtl">
      ${_renderCompareBar(T)}
      ${_renderCompareModal(T)}
      ${_renderSettings(T)}
      ${_renderAdminLogin(T)}
      ${_renderAdminPanel(T)}
      ${_renderInstallGuide(T)}
    ${_renderReportModal(T)}
    ${_renderLightbox(T)}
    ${_renderWishlistUpdateModal(T)}
      ${_renderHeader(T)}
      ${_renderHeader2(T)}
      <div style="padding-bottom:${state.cmpList.length>0&&!state.cmpOpen?'140px':'70px'}">
        ${state.pg==="home"?_renderHome(T,filtered,renderedApps,topRated,recent,mostDl,newWeek):''}
        ${state.pg==="categories"?_renderCategories(T):''}
        ${state.pg==="search"?_renderSearch(T):''}
        ${state.pg==="saved"?_renderSaved(T):''}
        ${state.pg==="stats"?_renderStats(T):''}
      </div>
      ${_renderBottomNav(T)}
      ${state.detailOpen&&state.selectedApp?_renderDetail(T):''}
    </div>`;

    _bindEvents(filtered);
    // استعادة موضع التمرير للوحة الأدمن إن وُجد
    if (_adminScrollRestore !== null) {
      const sc = document.getElementById("adminPanelScroll");
      if (sc) sc.scrollTop = _adminScrollRestore;
      _adminScrollRestore = null;
    }
  } catch(e) {
    console.error("Render error:",e);
    document.getElementById("app").innerHTML=`<div style="padding:20px;text-align:center;color:#ff5252">حدث خطأ: ${e.message}</div>`;
  }
}

function _renderHeader(T) {
  const bs  = state.bannerSettings || {speed:14, gap:12, maxWidth:160};
  const spd = bs.speed   || 14;

  const mxw = bs.maxWidth|| 160;

  // ── مصدر البانر: إعلانات مخصصة أو تطبيقات مميزة ──
  const customAds  = state.bannerAds || [];
  const pickedApps = state.apps.filter(a => isEditorPick(a)).slice(0, 6);
  const recentApps = state.apps.slice(0, 8);
  const bannerApps = pickedApps.length >= 3 ? pickedApps : recentApps;

  // شرائح إعلانات مخصصة
  const adChips = [...customAds, ...customAds, ...customAds].map(ad => `

                   white-space:nowrap;max-width:${mxw}px;overflow:hidden;text-overflow:ellipsis;display:block">
        ${escapeHtml(ad.text)}
      </span>
    </div>`).join('');

  // شرائح تطبيقات
  const appChips = [...bannerApps, ...bannerApps, ...bannerApps].map(app => `
    <div onclick="window.openDetail(${app.id})"
         style="flex-shrink:0;display:inline-flex;align-items:center;gap:6px;

                background:${T.card};border:1.5px solid ${T.brd};border-radius:22px;cursor:pointer">

           onerror="this.src='${getPlaceholderIcon(app.title)}'"
           style="width:22px;height:22px;border-radius:6px;object-fit:cover;flex-shrink:0">
      <span style="font-size:0.72em;font-weight:700;color:${T.tx};white-space:nowrap;
                   max-width:${mxw}px;overflow:hidden;text-overflow:ellipsis">${escapeHtml(app.title)}</span>
      ${isEditorPick(app) ? `<span style="font-size:0.62em;line-height:1">👑</span>` : isNew(app.date) ? `<span class="badge-new" style="font-size:0.45em;padding:1px 4px">جديد</span>` : ''}
    </div>`).join('');

  // شرائح ترويجية احتياطية (3 نسخ للحلقة المتواصلة)
  const promoBase = ['⚡ آخر الإضافات يومياً','⭐ أفضل التطبيقات المجانية','🔥 تحميل مباشر وسريع','✅ تطبيقات موثّقة وآمنة','👑 اختيارات المحرر'];

    .map(m => `<div style="flex-shrink:0;display:inline-flex;align-items:center;gap:6px;
                            padding:5px 13px;margin-left:${gap}px;

      <span style="font-size:0.74em;font-weight:700;color:${T.ac};white-space:nowrap">${m}</span>
    </div>`).join('');

  const tickerContent = customAds.length > 0 ? adChips
                      : bannerApps.length > 0  ? appChips
                      : promoChips;

  return `<div style="position:sticky;top:0;z-index:200;background:${T.bg2};border-bottom:1px solid ${T.brd}">
    <div style="height:58px;display:flex;align-items:center;padding:0 11px;gap:9px">

        </div>
      </div>
      <div style="flex:1;overflow:hidden;position:relative;height:36px;display:flex;align-items:center;direction:ltr">
        <div style="position:absolute;right:0;top:0;bottom:0;width:18px;
                    background:linear-gradient(to left,${T.bg2},transparent);z-index:1;pointer-events:none"></div>
        <div style="position:absolute;left:0;top:0;bottom:0;width:18px;
                    background:linear-gradient(to right,${T.bg2},transparent);z-index:1;pointer-events:none"></div>
        <div class="banner-ticker" style="display:flex;align-items:center;animation-duration:${spd}s">

  const tab = state.savedTab === "wishlist" ? "wishlist" : "hist";
  const wlMeta = loadWishlistMeta();

  // === بناء محتوى تبويب السجل ===
  let histContent = '';
  if (hist.length === 0) {
    histContent = '<div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:60px 20px;text-align:center"><span style="font-size:3.5em">📦</span><div style="font-size:1.08em;font-weight:700;color:' + T.tx2 + '">لا يوجد سجل تحميل</div><div style="font-size:0.82em;color:' + T.tx3 + '">ستظهر هنا التطبيقات التي حمّلتها</div></div>';
  } else {
    let rows = '';
    hist.forEach(function(h) {
      rows += '<div class="hc" onclick="window.openDetail(' + h.id + ')" style="background:' + T.card + ';border-radius:13px;border:1px solid ' + T.brd + ';display:flex;align-items:center;gap:11px;padding:11px 13px;cursor:pointer">'

          + '<div style="font-size:0.87em;font-weight:700;color:' + T.tx + ';overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escapeHtml(h.title||'—') + '</div>'
          + '<div style="font-size:0.7em;color:' + T.tx3 + ';margin-top:2px">⬇ ' + timeAgo(h.date) + '</div>'
        + '</div>'

      + '</div>';

  // === بناء محتوى تبويب الرغبات ===
  let wlContent = '';
  if (wlApps.length === 0) {
    wlContent = '<div style="display:flex;flex-direction:column;align-items:center;gap:14px;padding:60px 20px;text-align:center">'
      + '<span style="font-size:3.8em">💔</span>'

      + '<div style="font-size:0.82em;color:' + T.tx3 + '">اضغط على 🔖 في أي تطبيق</div>'
      + '</div>';
  } else {
    let rows = '';
    wlApps.forEach(function(app) {
      var rd = getRatingForUrl(app.url);

      var hasUpdate = !!(meta.date && app.date && app.date !== meta.date && new Date(app.date) > new Date(meta.date));

      var dlColor = (app.dl && app.dl !== 'not available') ? '#000' : '#fff';
      var dlText = (app.dl && app.dl !== 'not available') ? '⬇ تحميل' : '🌐 زيارة';
      rows += '<div class="hc" onclick="window.openDetail(' + app.id + ')" style="background:' + T.card + ';border-radius:13px;border:1.5px solid ' + (hasUpdate ? 'rgba(255,112,67,0.5)' : T.brd) + ';display:flex;align-items:center;gap:11px;padding:11px 13px;cursor:pointer;position:relative">'

        + '<img src="' + escapeAttr(app.thumb) + '" loading="lazy" onerror="this.src=\'' + getPlaceholderIcon(app.title) + '\'" style="width:54px;height:54px;border-radius:12px;object-fit:cover;border:1px solid ' + T.brd + ';flex-shrink:0">'
        + '<div style="flex:1;min-width:0">'
          + '<div style="font-size:0.88em;font-weight:700;color:' + T.tx + ';overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escapeHtml(app.title) + '</div>'
          + '<div style="display:flex;align-items:center;gap:5px;margin-top:2px;flex-wrap:wrap">'
            + '<span style="font-size:0.68em;color:' + T.tx3 + '">' + (CATS[app.cat]?.name||'') + '</span>'
            + updateLabel
          + '</div>'
          + '<div style="display:flex;align-items:center;gap:3px;margin-top:2px"><span style="color:' + T.gd + ';font-size:0.73em">' + stars(parseFloat(rd.avg)) + '</span><span style="font-size:0.67em;color:' + T.tx3 + '">' + rd.cnt + ' تقييم</span></div>'
        + '</div>'
        + '<div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex-shrink:0">'
          + '<button onclick="event.stopPropagation();window.downloadApk(\'' + escapeAttr(app.dl) + '\',' + app.id + ')" style="padding:6px 11px;border-radius:9px;border:none;cursor:pointer;font-size:0.74em;font-weight:700;background:' + dlBg + ';color:' + dlColor + ';white-space:nowrap">' + dlText + '</button>'
          + '<button onclick="event.stopPropagation();window.wlBtn(' + app.id + ')" style="padding:3px 9px;border-radius:8px;border:1px solid rgba(255,82,82,0.3);background:rgba(255,82,82,0.06);color:' + T.rd + ';font-size:0.7em;font-weight:700;cursor:pointer">🗑 حذف</button>'
        + '</div>'
      + '</div>';
    });
    wlContent = '<div style="display:flex;flex-direction:column;gap:9px">' + rows + '</div>';
  }

  // === شارة عدد الرغبات ===
  var wlBadge = wlApps.length > 0 ? '<span style="background:linear-gradient(135deg,#ff7043,#e64a19);color:#fff;font-size:0.72em;font-weight:800;padding:1px 6px;border-radius:8px;margin-right:4px">' + wlApps.length + '</span>' : '';
  var histLabel = hist.length > 0 ? '⬇ السجل (' + hist.length + ')' : '⬇ السجل';

  return '<div class="fu" style="padding:11px 11px 0">'
    + '<div style="font-size:1.12em;font-weight:800;margin-bottom:13px;display:flex;align-items:center;gap:8px"><span style="color:' + T.rd + '">❤️</span> المحفوظة</div>'
    + '<div style="display:flex;background:' + T.bg3 + ';border-radius:13px;padding:4px;gap:3px;margin-bottom:14px">'

    + '</div>'
    + (tab === 'hist' ? histContent : wlContent)
  + '</div>';
}

// ======================== صفحة الإحصائيات =========================
function _renderStats(T) {
  const total=state.apps.length;
  const totalDl=state.apps.reduce((s,a)=>s+(getRatingForUrl(a.url).dl||0),0);
  const totalRatings=state.apps.reduce((s,a)=>s+(getRatingForUrl(a.url).cnt||0),0);
  const totalViews=state.apps.reduce((s,a)=>s+(getRatingForUrl(a.url).vw||0),0);
  const catCounts=Object.fromEntries(Object.keys(CATS).filter(k=>k!=="all").map(k=>[k,state.apps.filter(a=>a.cat===k).length]));
  const topCat=Object.entries(catCounts).sort((a,b)=>b[1]-a[1]).filter(([,c])=>c>0).slice(0,8);
  const maxCatCount=Math.max(...topCat.map(([,c])=>c),1);
  const newWeek=getNewThisWeek().length;
  const topDl=getMostDownloaded().slice(0,5);
  return `<div class="fu" style="padding:11px 11px 0">
    <div style="font-size:1.12em;font-weight:800;margin-bottom:13px;display:flex;align-items:center;gap:8px"><span style="color:${T.ac}">📊</span> إحصائيات المتجر</div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:16px">
  ${[
    {i:"📱",v:total+"+",l:"تطبيق",c:T.ac},
    {i:"⬇",v:formatNumber(totalDl),l:"إجمالي التحميلات",c:T.or},
    {i:"⭐",v:totalRatings,l:"إجمالي التقييمات",c:T.gd},
    {i:"👁",v:formatNumber(totalViews),l:"إجمالي المشاهدات",c:"#ab47bc"},
    {i:"✨",v:newWeek,l:"جديد هذا الأسبوع",c:"#ff4081"},
    {i:"✅",v:state.apps.filter(isVerified).length,l:"تطبيق موثّق",c:"#00c878"}
  ].map(s=>`<div style="background:${T.card};border:1px solid ${T.brd};border-radius:14px;padding:14px 12px;text-align:center">
    <div style="font-size:1.8em;margin-bottom:4px">${s.i}</div>
    <div style="font-size:1.3em;font-weight:800;color:${s.c}">${s.v}</div>
    <div style="font-size:0.68em;color:${T.tx3};margin-top:2px">${s.l}</div>
  </div>`).join('')}
</div>
    <div style="background:${T.card};border:1px solid ${T.brd};border-radius:14px;padding:14px;margin-bottom:14px">
      <div style="font-size:0.82em;font-weight:700;color:${T.tx};margin-bottom:12px">📂 توزيع الفئات</div>
      ${topCat.map(([k,cnt])=>`<div style="margin-bottom:9px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <span style="font-size:0.77em;font-weight:600;color:${T.tx2}">${CATS[k].icon} ${CATS[k].name}</span>
          <span style="font-size:0.74em;color:${T.tx3}">${cnt}</span>
        </div>
        <div style="height:6px;background:${T.bg3};border-radius:4px;overflow:hidden">
          <div style="height:100%;width:${(cnt/maxCatCount*100).toFixed(0)}%;background:linear-gradient(90deg,${T.ac},${T.ac2});border-radius:4px;transition:width .5s"></div>
        </div>
      </div>`).join('')}
    </div>
    ${topDl.length>0?`<div style="background:${T.card};border:1px solid ${T.brd};border-radius:14px;padding:14px;margin-bottom:14px">
      <div style="font-size:0.82em;font-weight:700;color:${T.tx};margin-bottom:12px">🔥 الأكثر تحميلاً</div>
      ${topDl.map((app,i)=>{const rd=getRatingForUrl(app.url);return `<div onclick="window.openDetail(${app.id})" style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid ${T.brd};cursor:pointer">
        <span style="font-size:0.85em;font-weight:800;color:${[T.gd,T.tx3,T.or,T.tx3,T.tx3][i]||T.tx3};width:20px;text-align:center">${i+1}</span>
        <img src="${escapeAttr(app.thumb)}" loading="lazy" onerror="this.src='${getPlaceholderIcon(app.title)}'" style="width:38px;height:38px;border-radius:9px;object-fit:cover;flex-shrink:0">
        <div style="flex:1;min-width:0"><div style="font-size:0.83em;font-weight:700;color:${T.tx};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(app.title)}</div><div style="font-size:0.69em;color:${T.tx3}">⬇ ${formatNumber(rd.dl)} تحميل</div></div>
      </div>`}).join('')}
    </div>`:''}
  </div>`;
}

// ======================== ربط الأحداث =========================
function _bindEvents(filtered) {
  document.getElementById("searchInput")?.addEventListener("input",(e)=>{
    const val=e.target.value;
    const pos=e.target.selectionStart;
    state.q=val;
    state.searchSuggestions=getSearchSuggestions(state.q);
    state.showSuggestions=state.q.length>=2&&state.searchSuggestions.length>0;
    state.rCnt=0;
    render();
    requestAnimationFrame(()=>{ const inp=document.getElementById("searchInput"); if(inp){inp.focus();try{inp.setSelectionRange(pos,pos);}catch{}} });
  });
  document.getElementById("searchInput")?.addEventListener("focus",()=>{
    if(state.q.length>=2) { state.showSuggestions=true; render(); }
  });
  document.getElementById("searchInput")?.addEventListener("blur",()=>{
    setTimeout(()=>{ state.showSuggestions=false; render(); },200);
  });
  document.querySelectorAll(".cat-btn").forEach(btn=>btn.addEventListener("click",()=>{ state.cat=btn.dataset.cat; state.rCnt=0; render(); }));
  document.getElementById("viewToggleBtn")?.addEventListener("click",()=>{ state.viewMode=state.viewMode==="grid"?"list":"grid"; saveViewMode(state.viewMode); render(); });
  document.getElementById("sortBtn")?.addEventListener("click",(e)=>{ e.stopPropagation(); state.sortDropOpen=!state.sortDropOpen; render(); });
  document.querySelectorAll(".sort-opt").forEach(opt=>opt.addEventListener("click",()=>{ state.sortBy=opt.dataset.sort; state.sortDropOpen=false; render(); }));
  document.querySelectorAll(".nav-btn").forEach(btn=>btn.addEventListener("click",()=>{ state.pg=btn.dataset.page; render(); }));
  document.querySelectorAll("[data-cat]").forEach(el=>{
    if(el.dataset.cat&&!el.classList.contains("cat-btn")) {
      el.addEventListener("click",()=>{ state.cat=el.dataset.cat; state.pg="home"; render(); });
    }
  });
  document.getElementById("searchPageInput")?.addEventListener("input",(e)=>{
    const val=e.target.value;
    const pos=e.target.selectionStart;
    state.sq=val;
    if(state.sq.trim().length>2) {
      const rec=LS.get("apk_rec_searches",[]);
      const updated=[state.sq,...rec.filter(s=>s!==state.sq)].slice(0,6);
      LS.set("apk_rec_searches",updated);
    }
    render();
    requestAnimationFrame(()=>{ const inp=document.getElementById("searchPageInput"); if(inp){inp.focus();try{inp.setSelectionRange(pos,pos);}catch{}} });
  });
  const sliderTrack=document.getElementById("sliderTrack");
  if(sliderTrack) {
    sliderTrack.addEventListener("mouseenter",()=>{ state.sliderPaused=true; render(); });
    sliderTrack.addEventListener("mouseleave",()=>{ state.sliderPaused=false; render(); });
  }
  const sentinelEl=document.getElementById("sentinel");
  if(sentinelEl&&state.rCnt+PER_PAGE<filtered.length) {
    const observer=new IntersectionObserver((entries)=>{
      if(entries[0].isIntersecting) { state.rCnt+=PER_PAGE; render(); observer.disconnect(); }
    },{rootMargin:"200px"});
    observer.observe(sentinelEl);
  }
  document.addEventListener("click",(e)=>{ if(!e.target.closest("#sortBtn")&&!e.target.closest(".sort-opt")) { if(state.sortDropOpen) { state.sortDropOpen=false; render(); } } },{once:true});
  // أزرار تبويب المحفوظة (saved-tab-btn)
  document.querySelectorAll(".saved-tab-btn").forEach(btn=>btn.addEventListener("click",()=>{
    state.savedTab=btn.dataset.tab; render();
  }));
  // أزرار نوع المشكلة في بلاغ
  document.querySelectorAll(".rp-btn").forEach(btn=>btn.addEventListener("click",(e)=>{
    e.stopPropagation();
    state.reportProblemIdx=parseInt(btn.dataset.idx);
    state.reportExtra=document.getElementById("reportExtra")?.value||"";
    render();
  }));
  // ═══ ربط أحداث لوحة الأدمن ═══
  const apBg = document.getElementById("adminPanelBg");
  if (apBg) {
    // إغلاق بالخلفية
    apBg.addEventListener("click", (e)=>{ if(e.target===apBg) window.closeAdminPanel(); });
    // زر الإغلاق
    document.getElementById("adminPanelClose")?.addEventListener("click", window.closeAdminPanel);
    // تبويبات
    apBg.querySelectorAll("[data-admin-tab]").forEach(el=>el.addEventListener("click",()=>{
      state.adminPanelTab = el.dataset.adminTab; render();
    }));
    // أزرار الأرقام (data-adj)
    apBg.querySelectorAll("[data-adj]").forEach(btn=>btn.addEventListener("click",e=>{
      e.stopPropagation();
      window.adminAdjust(btn.dataset.adj, btn.dataset.field, parseInt(btn.dataset.delta));
    }));
    // إخفاء/إظهار (data-hide)
    apBg.querySelectorAll("[data-hide]").forEach(btn=>btn.addEventListener("click",e=>{
      e.stopPropagation();
      window.adminToggleHide(parseInt(btn.dataset.hide));
    }));
    // اختيار المحرر (data-ep)
    apBg.querySelectorAll("[data-ep]").forEach(btn => btn.addEventListener("click", e => {
      e.stopPropagation();
      window.adminToggleEditor(parseInt(btn.dataset.ep));
    }));
    // رد على تعليق (data-reply)
    apBg.querySelectorAll("[data-reply]").forEach(btn=>btn.addEventListener("click",e=>{
      e.stopPropagation();
      window.adminStartReply(btn.dataset.reply + '_' + btn.dataset.ridx);
    }));
    // حذف تعليق (data-del)
    apBg.querySelectorAll("[data-del]").forEach(btn=>btn.addEventListener("click",e=>{
      e.stopPropagation();
      window.adminDeleteComment(btn.dataset.del, parseInt(btn.dataset.didx));
    }));
    // إلغاء الرد
    apBg.querySelector("[data-cancel-reply]")?.addEventListener("click", window.adminCancelReply);
    // نشر الرد
    const srBtn = apBg.querySelector("[data-submit-reply]");
    if (srBtn) srBtn.addEventListener("click", ()=>{
      window.adminSubmitReply(srBtn.dataset.submitReply, parseInt(srBtn.dataset.after));
    });
    // حقل كلمة مرور الأدمن — إعادة ضبط border عند الكتابة بدون render
    const passInp = document.getElementById("adminPassInput");
    if (passInp) {
      passInp.addEventListener("input", () => {
        state.adminLoginError = false;
        passInp.style.border = "";
        const errEl = document.getElementById("adminLoginErr");
        if (errEl) errEl.style.display = "none";
      });
    }
    // زر التحديث — يجلب السحابة ويحدّث اللوحة
    document.getElementById("adminRefreshBtn")?.addEventListener("click", async () => {
      showToast("⏳ جاري جلب البيانات...");
      try {
        showToast("⏳ جاري الجلب...");
        const cloud = await fetchCloudData();
        const r   = cloud.r   || {};
        const rev = cloud.rev || {};
        // التقييمات: الأعلى يسود
        Object.entries(r).forEach(([id,vals]) => {
          const cur = state.ratings[id]||{tot:0,cnt:0,vw:0,dl:0};
          state.ratings[id] = {
            tot:Math.max(cur.tot||0,vals.tot||0),
            cnt:Math.max(cur.cnt||0,vals.cnt||0),
            vw: Math.max(cur.vw||0, vals.vw||0),
            dl: Math.max(cur.dl||0, vals.dl||0)
          };
        });
        // التعليقات: استبدال كامل
        Object.entries(rev).forEach(([id,arr]) => { state.reviews[id] = arr; });
        saveRatingsToLocal(state.ratings);
        saveLocalReviews(state.reviews);
        render();
        showToast("✅ تم التحديث من السحابة");
      } catch { showToast("❌ فشل الاتصال بالسحابة"); }
    });
    // تبديل التبويب: جلب تلقائي عند فتح تبويب التعليقات
    apBg.querySelectorAll("[data-admin-tab]").forEach(el => {
      el.addEventListener("click", async () => {
        if (el.dataset.adminTab === 'comments') {
          showToast("⏳ جاري جلب التعليقات...");
          try {
            const cloud = await fetchCloudData();
            // استبدال كامل — ليس دمج
            Object.entries(cloud.rev||{}).forEach(([id,arr]) => { state.reviews[id] = arr; });
            saveLocalReviews(state.reviews);
          } catch(e) { console.warn(e); }
          render();
        }
      });
    });
  }
  // إغلاق الـ detail بزر الرجوع — معالج في window.onpopstate أسفل الملف
}

window.adminSaveAd = async function() {
  const icon     = (document.getElementById('adFormIcon')?.value || '').trim() || '⚡';
  const text     = (document.getElementById('adFormText')?.value || '').trim();
  const bgColor  = document.getElementById('adFormBg')?.value  || '#00e5b0';
  const textColor= document.getElementById('adFormTx')?.value  || '#000000';
  if (!text) { showToast('⚠️ أدخل نص الإعلان!'); return; }
  const ads    = [...state.bannerAds];
  const editId = state.adForm.editId;
  if (editId !== null) {
    ads[editId] = {icon, text, bgColor, textColor};
  } else {
    ads.push({icon, text, bgColor, textColor});
  }
  state.bannerAds = ads;
  saveBannerAds(ads);
  state.adForm = {editId:null, icon:'⚡', text:'', bgColor:'#00e5b0', textColor:'#000000'};
  render();
  showToast('⏳ جاري الرفع للسحابة...');
  const ok = await adminDirectSync();
  showToast(ok ? (editId!==null?'✅ تم تعديل الإعلان وحفظه ☁️':'✅ تم إضافة الإعلان وحفظه ☁️') : '⚠️ حُفظ محلياً فقط');
};

window.adminDeleteAd = async function(idx) {
  if (!confirm('🗑 حذف هذا الإعلان نهائياً؟')) return;
  const ads = [...state.bannerAds];
  ads.splice(idx, 1);
  state.bannerAds = ads;
  saveBannerAds(ads);
  render();
  showToast('⏳ جاري الرفع...');
  const ok = await adminDirectSync();
  showToast(ok ? '🗑 تم الحذف ورُفع للسحابة ✓' : '🗑 حُذف محلياً فقط');
};

window.adminEditAd = function(idx) {
  const ad = state.bannerAds[idx];
  if (!ad) return;
  state.adForm = {editId:idx, icon:ad.icon, text:ad.text, bgColor:ad.bgColor, textColor:ad.textColor};
  render();

};

window.adminCancelEditAd = function() {

// ======================== وظائف الأدمن =========================

// دالة موحّدة لرفع البيانات للسحابة مباشرة (بدون delta queue)
// رفع مباشر للسحابة — يتجاوز pushCloud لأنها تبتلع الأخطاء
// مزامنة الأدمن — تستخدم fetchCloudData و pushCloud الموجودتين (المختبرتين)
// مزامنة الأدمن — تستخدم pushCloud المُجرَّبة مباشرة
async function adminDirectSync() {
  // إلغاء أي pending queue حتى لا يتعارض
  if (pendingSyncTimer) { clearTimeout(pendingSyncTimer); pendingSyncTimer = null; }
  pendingUpdates.r = {}; pendingUpdates.rev = {};

  // ① جلب السحابة أولاً لتجنب الكتابة فوق بيانات موجودة
  let cloudData = {r:{}, rev:{}, ep:[], ads:[], bs:{}};
  try { cloudData = await fetchCloudData(); } catch {}

  // ② دمج التقييمات: أخذ الأعلى دائماً
  const mergedR = {...(cloudData.r || {})};
  Object.entries(state.ratings).forEach(([id, vals]) => {
    const cur = mergedR[id] || {tot:0,cnt:0,vw:0,dl:0};
    mergedR[id] = {
      tot: Math.max(cur.tot||0, vals.tot||0),
      cnt: Math.max(cur.cnt||0, vals.cnt||0),
      vw:  Math.max(cur.vw||0,  vals.vw||0),
      dl:  Math.max(cur.dl||0,  vals.dl||0)
    };
  });

  // ③ دمج التعليقات: لا تُحذف تعليقات السحابة
  const mergedRev = {...(cloudData.rev || {})};
  Object.entries(state.reviews).forEach(([id, localArr]) => {
    if (!mergedRev[id]) { mergedRev[id] = localArr; return; }
    const existing = new Set(mergedRev[id].map(x => x.d + x.n));
    const newOnes = (localArr||[]).filter(x => !existing.has(x.d + x.n));
    mergedRev[id] = [...newOnes, ...mergedRev[id]].slice(0, 15);
  });

  // ④ تحديث state بالبيانات المدمجة قبل الرفع
  state.ratings = mergedR;
  state.reviews = mergedRev;
  saveRatingsToLocal(mergedR);
  saveLocalReviews(mergedRev);

  const ok = await pushCloud({
    r: mergedR,
    rev: mergedRev,
    ep: state.editorPicks,
    ads: state.bannerAds||[],
    bs: state.bannerSettings||{}
  });
  return ok === true;
}

// دخول الأدمن السري — 5 ضغطات على شعار A+ خلال 3 ثوانٍ
let _stTaps=0, _stTimer=null;
window._secretTap = () => {
  _stTaps++;
  if (_stTimer) clearTimeout(_stTimer);
  if (_stTaps >= 5) {
    _stTaps = 0;
    window.adminLogin();
    return;
  }
  // تلميح بصري خفيف بعد الضغطة الثالثة
  if (_stTaps >= 3) showToast("·".repeat(_stTaps));
  _stTimer = setTimeout(() => { _stTaps = 0; }, 3000);
};

  } else {

    const inp = document.getElementById("adminPassInput");

window.openAdminPanel = async () => {
  state.adminPanelOpen = true;
  state.settingsOpen = false;
  state.adminPanelTab = 'stats';
  render();
  // جلب كامل من السحابة وإحلاله (ليس دمج)
  try {
    const cloud = await fetchCloudData();
    const r   = cloud.r   || {};
    const rev = cloud.rev || {};
    const ep  = cloud.ep  || [];
    // التقييمات: دمج (الأعلى يسود)
    Object.entries(r).forEach(([id, vals]) => {
      const cur = state.ratings[id] || {tot:0,cnt:0,vw:0,dl:0};
      state.ratings[id] = {
        tot: Math.max(cur.tot||0, vals.tot||0),
        cnt: Math.max(cur.cnt||0, vals.cnt||0),
        vw:  Math.max(cur.vw||0,  vals.vw||0),
        dl:  Math.max(cur.dl||0,  vals.dl||0)
      };
    });
    // التعليقات: استبدال كامل بنسخة السحابة
    Object.entries(rev).forEach(([id, arr]) => {
      state.reviews[id] = arr;
    });
    // اختيارات المحرر: استبدال كامل بنسخة السحابة
    state.editorPicks = ep;
    saveEditorPicks(ep);
    // الإعلانات وإعدادات البانر: مزامنة من السحابة
    if (cloud.ads && cloud.ads.length) { state.bannerAds = cloud.ads; saveBannerAds(cloud.ads); }
    if (cloud.bs && Object.keys(cloud.bs||{}).length) { state.bannerSettings = Object.assign({speed:14,gap:12,maxWidth:160}, cloud.bs); saveBannerSettings(state.bannerSettings); }
    saveRatingsToLocal(state.ratings);
    saveLocalReviews(state.reviews);
  } catch(e) { console.warn("openAdminPanel fetch error:", e); }
  render();
};

window.closeAdminPanel = () => {
  state.adminPanelOpen = false;
  render();
};

// تعديل الأرقام — يحفظ محلياً ويرفع للسحابة
window.adminAdjust = async (appId, field, delta) => {
  const old = state.ratings[appId] || {tot:0,cnt:0,vw:0,dl:0};
  const newVal = Math.max(0, (old[field]||0) + delta);
  state.ratings = {...state.ratings, [appId]: {...old, [field]: newVal}};
  saveRatingsToLocal(state.ratings);
  // حفظ موضع التمرير — يُستعاد داخل _doRender بعد إعادة بناء DOM
  _adminScrollRestore = document.getElementById("adminPanelScroll")?.scrollTop || 0;
  render();
  showToast("⏳ جاري الرفع...");
  const ok = await adminDirectSync();
  showToast(ok
    ? `☁️ ${field==='dl'?'التحميلات':'المشاهدات'}: ${formatNumber(newVal)} ✓`
    : `⚠️ فشل الرفع — حُفظ محلياً`);
};

window.adminDeleteComment = async (appId, idx) => {
  if (!confirm("🗑 حذف هذا التعليق نهائياً؟")) return;
  const arr = [...(state.reviews[appId]||[])];
  arr.splice(idx, 1);
  state.reviews = {...state.reviews, [appId]: arr};
  saveLocalReviews(state.reviews);
  render();
  const ok = await adminDirectSync();
  showToast(ok ? "✅ تم الحذف ورُفع للسحابة" : "⚠️ حُذف محلياً فقط");
};

// نشر الرد الرسمي
window.adminSubmitReply = async (appId, afterIdx) => {
  const text = (document.getElementById("adminReplyTa")?.value || "").trim();
  if (!text) { showToast("⚠️ الرد فارغ!"); return; }
  const reply = {n:"الإدارة", t:text, s:0, d:new Date().toISOString(), isAdminReply:true};
  const arr = [...(state.reviews[appId]||[])];
  arr.splice(afterIdx+1, 0, reply);
  state.reviews = {...state.reviews, [appId]: arr};
  saveLocalReviews(state.reviews);
  state.adminCommentApp = null;
  render();
  const ok = await adminDirectSync();
  showToast(ok ? "👑 تم نشر الرد الرسمي!" : "⚠️ حُفظ محلياً فقط");
};
